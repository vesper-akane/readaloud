<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Readaloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f3f5f4; --paper:#ffffff; --ink:#18221f; --muted:#5d6b67; --line:#d8dfdc;
  --accent:#1d6b62; --accent-ink:#ffffff; --accent-soft:#dcece8; --warm:#b5562b; --star:#c8841a;
  --zh:#1d6b62; --ja:#9b3f5c; --en:#3d5a99; --fr:#8a6412; --de:#6b4fa0; --es:#a3402e; --it:#3f7a2e;
  --sans:"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei","Yu Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111715; --paper:#18201e; --ink:#e6ecea; --muted:#95a39f; --line:#2c3835;
    --accent:#5cc0b1; --accent-ink:#0d1a17; --accent-soft:#1f3632; --warm:#e08a5f; --star:#f0b54a;
    --zh:#5cc0b1; --ja:#e28aa6; --en:#8fa9e6; --fr:#e0b458; --de:#b39ce8; --es:#ee8f7a; --it:#8fcf7a;
  }
}
:root[data-theme="dark"]{
  --ground:#111715; --paper:#18201e; --ink:#e6ecea; --muted:#95a39f; --line:#2c3835;
  --accent:#5cc0b1; --accent-ink:#0d1a17; --accent-soft:#1f3632; --warm:#e08a5f; --star:#f0b54a;
  --zh:#5cc0b1; --ja:#e28aa6; --en:#8fa9e6; --fr:#e0b458; --de:#b39ce8; --es:#ee8f7a; --it:#8fcf7a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 130px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
header .h{flex:1;min-width:16em}
header h1{margin:0;font-size:24px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.ui{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.ui select{width:auto}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-family:var(--mono)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec + .sec{border-top:1px solid var(--line);padding-top:14px}
textarea{width:100%;min-height:150px;resize:vertical;font:inherit;font-size:16px;line-height:1.7;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea:focus,select:focus,input:focus-visible,button:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;padding:6px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.setting{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.setting label{font-size:14px}
.setting output{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
.setting input{grid-column:1 / -1}
input[type=range]{width:100%;accent-color:var(--accent)}
.voices{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.voices span{font-size:13px;font-weight:600;white-space:nowrap}
select{width:100%;min-width:0;font:inherit;font-size:13px;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.note{font-size:13px;color:var(--warm)}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.tools{display:flex;flex-direction:column;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.markbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.markcount{font-size:13.5px;font-weight:600;color:var(--star);margin-right:auto}
.toast{font-size:13px;color:var(--accent);min-height:1.2em}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
li:last-child{border-bottom:0}
li:hover{background:var(--ground)}
li.now{background:var(--accent-soft)}
li.dim{opacity:.45}
li .n{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.rep{font-family:var(--mono);font-size:11px;color:var(--accent);display:block}
.texts{display:flex;flex-direction:column;gap:3px;min-width:0}
.o{font-size:17px;line-height:1.6;word-break:break-word}
.t{font-size:14.5px;line-height:1.55;color:var(--muted);word-break:break-word}
.t.missing{font-style:italic;opacity:.6}
.speaking{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.veil{filter:blur(6px);user-select:none;cursor:help}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tags{display:flex;gap:4px}
.tag{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 5px;line-height:1.5}
.tag.zh{color:var(--zh)} .tag.ja{color:var(--ja)} .tag.en{color:var(--en)} .tag.fr{color:var(--fr)} .tag.de{color:var(--de)} .tag.es{color:var(--es)} .tag.it{color:var(--it)}
.star{border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 4px;border-radius:6px}
.star[aria-pressed="true"]{color:var(--star)}
.warn{font-size:13px;color:var(--warm)}
.empty{color:var(--muted);font-size:14px;padding:12px 4px;display:block;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:1120px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.play{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:10px 20px;cursor:pointer;min-width:7.5em}
.ic{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 13px;cursor:pointer}
.status{flex:1;min-width:9em;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){li{transition:background .2s}.veil{transition:filter .2s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="h">
      <h1 data-i18n="h1"></h1>
      <p data-i18n="sub"></p>
    </div>
    <label class="ui"><span data-i18n="uiLang"></span>
      <select id="uiLang" data-i18n-aria="uiLang">
        <option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="it">Italiano</option>
      </select>
    </label>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="inLbl">
      <div class="sec">
        <div class="label" id="inLbl" data-i18n="orig"></div>
        <textarea id="text" data-i18n-ph="origPh" aria-labelledby="inLbl"></textarea>
        <div class="label" id="trLbl" data-i18n="trans"></div>
        <textarea id="trans" data-i18n-ph="transPh" aria-labelledby="trLbl"></textarea>
        <div class="row" style="justify-content:space-between">
          <div class="row">
            <span class="field" data-i18n="splitBy"></span>
            <div class="seg" role="group" id="splitSeg">
              <button type="button" data-v="sentence" data-i18n="bySentence"></button>
              <button type="button" data-v="line" data-i18n="byLine"></button>
            </div>
          </div>
          <div class="row">
            <button class="btn" id="sample" type="button" data-i18n="sample"></button>
            <button class="btn" id="clear" type="button" data-i18n="clear"></button>
          </div>
        </div>
        <div class="two">
          <label class="field"><span data-i18n="srcLang"></span><select id="srcLang"></select></label>
          <label class="field"><span data-i18n="tgtLang"></span><select id="tgtLang"></select></label>
        </div>
      </div>

      <div class="sec">
        <div class="label" data-i18n="settings"></div>
        <span class="field" data-i18n="readWhat"></span>
        <div class="seg" role="group" id="readSeg">
          <button type="button" data-v="orig" data-i18n="rOrig"></button>
          <button type="button" data-v="both" data-i18n="rBoth"></button>
          <button type="button" data-v="trans" data-i18n="rTrans"></button>
        </div>
        <div class="setting"><label for="rate" data-i18n="rate"></label><output id="rateOut"></output><input type="range" id="rate" min="0.4" max="2" step="0.1" value="1"></div>
        <div class="setting"><label for="gap" data-i18n="gap"></label><output id="gapOut"></output><input type="range" id="gap" min="0" max="15" step="0.5" value="1.5"></div>
        <div class="setting"><label for="repeat" data-i18n="repeat"></label><output id="repeatOut"></output><input type="range" id="repeat" min="1" max="10" step="1" value="1"></div>
        <div class="setting"><label for="repGap" data-i18n="repGap"></label><output id="repGapOut"></output><input type="range" id="repGap" min="0" max="15" step="0.5" value="1"></div>
      </div>

      <div class="sec">
        <div class="label" data-i18n="voices"></div>
        <div class="voices" id="voiceRows"></div>
        <div class="note" id="voiceNote" hidden></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="listLbl">
      <div class="tools">
        <div class="listhead"><div class="label" id="listLbl" data-i18n="sentences"></div><div class="count" id="count"></div></div>
        <div class="row">
          <label class="chk"><input type="checkbox" id="showO" checked><span data-i18n="showOrig"></span></label>
          <label class="chk"><input type="checkbox" id="showT" checked><span data-i18n="showTrans"></span></label>
          <label class="chk"><input type="checkbox" id="onlyMarked"><span data-i18n="onlyMarked"></span></label>
        </div>
        <div class="markbar">
          <span class="markcount" id="markCount"></span>
          <button class="btn pri" id="exportCsv" type="button" data-i18n="exportCsv"></button>
          <button class="btn" id="copyMarks" type="button" data-i18n="copy"></button>
          <button class="btn" id="clearMarks" type="button" data-i18n="clearMarks"></button>
        </div>
        <div class="toast" id="toast" aria-live="polite"></div>
        <div class="warn" id="mismatch" hidden></div>
      </div>
      <ol id="list"></ol>
    </section>
  </div>
</div>

<div class="bar">
  <div class="in">
    <button class="ic" id="prev" type="button">⟨ <span data-i18n="prev"></span></button>
    <button class="play" id="play" type="button"></button>
    <button class="ic" id="next" type="button"><span data-i18n="next"></span> ⟩</button>
    <button class="ic" id="stop" type="button">■ <span data-i18n="stop"></span></button>
    <label class="chk"><input type="checkbox" id="loop"><span data-i18n="loop"></span></label>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</div>

// ---------- splitting & detection ----------
function split(text){
  const out = [];
  text.split(/\n+/).forEach(line => {
    if (S.split === "line"){ const s = line.trim(); if (s && /[\p{L}\p{N}]/u.test(s)) out.push(s); return; }
    const re = /[^。！？!?；;…]+(?:[。！？!?；;…]+[」』”"'’）)»]*)?|[。！？!?；;…]+/g;
    (line.match(re) || []).forEach(chunk => {
      chunk.split(/(?<=[\p{L}\p{N}"'’)\]»][.](?=\s+[\p{Lu}"'(«¿¡]))/u).forEach(p => {
        const s = p.trim();
        if (!s) return;
        if (!/[\p{L}\p{N}]/u.test(s) && out.length) out[out.length-1] += s; // stray punctuation joins previous
        else if (/[\p{L}\p{N}]/u.test(s)) out.push(s);
      });
    });
  });
  return out;
}
const W = {
  en:/\b(the|is|are|and|you|to|of|it|that|this|what|with|have|was|for|my|i'm|don't|would|like)\b/g,
  fr:/\b(le|la|les|des|est|et|je|tu|vous|nous|une|pas|que|qui|dans|pour|avec|c'est|très|mon|ma|au|du|j'|l'|d')/g,
  de:/\b(der|die|das|und|ist|ich|nicht|ein|eine|zu|mit|sie|wir|auch|es|den|dem|sehr|du|mein|haben|bin)\b/g,
  es:/(^|[^\p{L}])(el|los|las|es|y|que|en|una|no|por|con|para|muy|está|estoy|soy|tengo|quieres|hola|pero|como|yo|mi|del|al|se|lo)(?![\p{L}])/gu,
  it:/(^|[^\p{L}])(il|gli|è|e|che|di|non|per|con|sono|ho|ciao|della|molto|vuoi|questo|questa|io|mi|anche|come|ma|nel|alla|un'|l')(?![\p{L}])/gu
};
function detect(s){
  if (/[぀-ヿㇰ-ㇿ]/.test(s)) return "ja";
  const han = (s.match(/[㐀-䶿一-鿿]/g) || []).length;
  const lat = (s.match(/[A-Za-zÀ-ÿœŒß]/g) || []).length;
  if (han && han * 2 >= lat) return "zh";
  if (!lat) return "zh";
  const low = s.toLowerCase();
  const sc = {en:(low.match(W.en)||[]).length, fr:(low.match(W.fr)||[]).length*1.1, de:(low.match(W.de)||[]).length*1.1,
    es:(low.match(W.es)||[]).length, it:(low.match(W.it)||[]).length};
  sc.fr += (low.match(/[éêëâîïôûçœæ]/g)||[]).length * 1.5 + (low.match(/[èàù]/g)||[]).length * 0.5;
  sc.es += (low.match(/[ñ¿¡]/g)||[]).length * 3 + (low.match(/[áíóú]/g)||[]).length * 1.5;
  sc.it += (low.match(/[ìò]/g)||[]).length * 2 + (low.match(/[èàù]/g)||[]).length * 0.6;
  sc.de += (low.match(/[äöüß]/g)||[]).length * 2;
  return Object.keys(sc).reduce((a,b) => sc[b] > sc[a] ? b : a, "en");
}
const srcOf = s => S.src === "auto" ? detect(s) : S.src;
const tgtOf = s => S.tgt === "auto" ? detect(s) : S.tgt;

// ---------- i18n ----------
function applyUI(){
  document.documentElement.lang = {zh:"zh-CN", ja:"ja", en:"en", fr:"fr", de:"de", es:"es", it:"it"}[S.ui];
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.i18nAria)));
  ["srcLang","tgtLang"].forEach(id => {
    const sel = $(id), val = id === "srcLang" ? S.src : S.tgt;
    sel.innerHTML = '<option value="auto">'+t("auto")+'</option>' + CODES.map(c => '<option value="'+c+'">'+langName(c)+'</option>').join("");
    sel.value = val;
  });
  $("uiLang").value = S.ui;
  segs(); outputs(); fillVoices(); render(); updateMarkCount(); setPlayBtn();
  if (!playing) els.status.textContent = t("ready");
}
function segs(){
  [["splitSeg","split"],["readSeg","read"]].forEach(([id,k]) => [...$(id).children].forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S[k])));

// ---------- render ----------
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function render(){
  const os = split(els.text.value), ts = split(els.trans.value);
  items = os.map((o,i) => ({o, t: ts[i] || "", ol: srcOf(o), tl: ts[i] ? tgtOf(ts[i]) : null}));
  // refresh stored translations for marked sentences
  let changed = false;
  items.forEach(it => { const m = marks[it.o]; if (m && (m.t !== it.t || m.ol !== it.ol || m.tl !== it.tl)){ m.t = it.t; m.ol = it.ol; m.tl = it.tl; changed = true; } });
  if (changed) saveMarks();
  if (current >= items.length) current = 0;
  $("count").textContent = items.length ? t("count", {n: items.length}) : "";
  const mm = $("mismatch");
  if (ts.length && ts.length !== os.length){ mm.textContent = t("mismatch", {a: os.length, b: ts.length}); mm.hidden = false; } else mm.hidden = true;
  const list = els.list; list.innerHTML = "";
  if (!items.length){ list.innerHTML = '<li class="empty">'+esc(t("empty"))+'</li>'; return; }
  const hasTrans = ts.length > 0;
  items.forEach((it,i) => {
    const li = document.createElement("li");
    li.tabIndex = 0; li.dataset.i = i;
    const m = !!marks[it.o];
    if (S.onlyMarked && !m) li.classList.add("dim");
    li.innerHTML =
      '<span class="n">'+String(i+1).padStart(2,"0")+'</span>'+
      '<div class="texts"><div class="o'+(S.showO?'':' veil')+'"'+(S.showO?'':' data-hide="1"')+' lang="'+BCP[it.ol]+'">'+esc(it.o)+'</div>'+
      (hasTrans ? '<div class="t'+(it.t?'':' missing')+(S.showT||!it.t?'':' veil')+'"'+(S.showT||!it.t?'':' data-hide="1"')+(it.tl?' lang="'+BCP[it.tl]+'"':'')+'>'+esc(it.t || t("noTrans"))+'</div>' : '')+'</div>'+
      '<div class="side"><button type="button" class="star" aria-pressed="'+m+'" aria-label="'+esc(t(m?"markOff":"markOn"))+'" title="'+esc(t(m?"markOff":"markOn"))+'">'+(m?"★":"☆")+'</button>'+
      '<div class="tags"><span class="tag '+it.ol+'">'+TAG[it.ol]+'</span>'+(it.tl?'<span class="tag '+it.tl+'">'+TAG[it.tl]+'</span>':'')+'</div></div>';
    li.querySelectorAll("[data-hide]").forEach(v => { v.title = t("reveal"); });
    li.addEventListener("click", e => {
      if (e.target.closest(".star")){ toggleMark(i); return; }
      const v = e.target.closest("[data-hide]");
      if (v){ const on = v.classList.toggle("veil"); v.title = t(on ? "reveal" : "hide"); return; }
      start(i);
    });
    li.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target === li){ e.preventDefault(); start(i); } });
    list.appendChild(li);
  });
  mark(current, playing);
}
function mark(i, on, rep, part){
  [...els.list.children].forEach(li => { li.classList.remove("now"); const r = li.querySelector(".rep"); if (r) r.remove(); li.querySelectorAll(".speaking").forEach(x => x.classList.remove("speaking")); });
  const li = els.list.children[i];
  if (!li || li.dataset.i == null || !on) return;
  li.classList.add("now");
  if (rep){ const r = document.createElement("span"); r.className = "rep"; r.textContent = rep; li.querySelector(".n").appendChild(r); }
  if (part){ const p = li.querySelector(part === "o" ? ".o" : ".t"); if (p) p.classList.add("speaking"); }
  const b = li.getBoundingClientRect();
  if (b.top < 60 || b.bottom > innerHeight - 120) li.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}

// ---------- marks ----------
function toggleMark(i){
  const it = items[i];
  if (marks[it.o]) delete marks[it.o];
  else marks[it.o] = {o: it.o, t: it.t, ol: it.ol, tl: it.tl, at: Date.now()};
  saveMarks(); updateMarkCount();
  const li = els.list.children[i], m = !!marks[it.o], b = li.querySelector(".star");
  b.setAttribute("aria-pressed", m); b.textContent = m ? "★" : "☆";
  b.title = t(m ? "markOff" : "markOn"); b.setAttribute("aria-label", b.title);
  li.classList.toggle("dim", S.onlyMarked && !m);
}
const markList = () => Object.values(marks).sort((a,b) => a.at - b.at);
function updateMarkCount(){
  const n = Object.keys(marks).length;
  $("markCount").textContent = t("marked", {n});
  ["exportCsv","copyMarks","clearMarks"].forEach(id => $(id).disabled = !n);
}
let toastT;
function toast(msg){ const e = $("toast"); e.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => e.textContent = "", 4000); }
function csvCell(v){ v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
$("exportCsv").addEventListener("click", () => {
  const rows = markList();
  if (!rows.length){ toast(t("noMarks")); return; }
  const head = [t("colNo"), t("srcLang"), t("rOrig"), t("tgtLang"), t("rTrans")];
  const lines = [head].concat(rows.map((m,i) => [i+1, langName(m.ol), m.o, m.tl ? langName(m.tl) : "", m.t || ""])).map(r => r.map(csvCell).join(","));
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  const d = new Date(), pad = n => String(n).padStart(2,"0");
  a.href = URL.createObjectURL(blob);
  a.download = "readaloud-unfamiliar-" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(t("exported", {n: rows.length}));
});
$("copyMarks").addEventListener("click", async () => {
  const rows = markList();
  if (!rows.length){ toast(t("noMarks")); return; }
  const text = rows.map((m,i) => (i+1) + ". " + m.o + (m.t ? "\n   " + m.t : "")).join("\n\n");
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){
    try{ const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); }catch(e2){}
  }
  toast(ok ? t("copied", {n: rows.length}) : t("copyFail"));
});
$("clearMarks").addEventListener("click", () => {
  if (!Object.keys(marks).length) return;
  if (!confirm(t("confirmClear"))) return;
  marks = {}; saveMarks(); updateMarkCount(); render();
});

// ---------- voices ----------
function fillVoices(){
  const all = synth ? synth.getVoices() : [];
  const rows = $("voiceRows"), note = $("voiceNote"), missing = [];
  const prevVals = {}; CODES.forEach(c => { const s = $("v"+c); prevVals[c] = s ? s.value : ((saved && saved.voices && saved.voices[c]) || ""); });
  rows.innerHTML = "";
  CODES.forEach(c => {
    const vs = all.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(c));
    const lab = document.createElement("span"); lab.textContent = langName(c); lab.style.color = "var(--"+c+")";
    const sel = document.createElement("select"); sel.id = "v"+c; sel.setAttribute("aria-label", t("voices") + " – " + langName(c));
    sel.innerHTML = '<option value="">'+esc(t("sysDefault"))+'</option>' + vs.map(v => '<option value="'+encodeURIComponent(v.voiceURI)+'">'+esc(v.name)+' ('+esc(v.lang)+')</option>').join("");
    const prev = prevVals[c];
    if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
    else if (vs.length){
      const main = BCP[c].toLowerCase();
      const pick = vs.find(v => v.lang.replace("_","-").toLowerCase() === main && /natural|neural|premium|enhanced|google/i.test(v.name)) || vs.find(v => v.lang.replace("_","-").toLowerCase() === main) || vs[0];
      sel.value = encodeURIComponent(pick.voiceURI);
    }
    sel.addEventListener("change", save);
    rows.appendChild(lab); rows.appendChild(sel);
    if (all.length && !vs.length) missing.push(langName(c));
  });
  if (!synth){ note.textContent = t("noTTS"); note.hidden = false; }
  else if (missing.length){ note.textContent = t("noVoice", {x: missing.join(", ")}); note.hidden = false; }
  else note.hidden = true;
}
function voiceFor(L){
  const s = $("v"+L); const id = s && s.value ? decodeURIComponent(s.value) : "";
  return id ? synth.getVoices().find(v => v.voiceURI === id) : null;
}

// ---------- playback ----------
function wait(ms, id){
  return new Promise(r => {
    if (ms <= 0) return r();
    const end = Date.now() + ms;
    const tick = setInterval(() => { if (id !== runId || Date.now() >= end){ clearInterval(tick); r(); } }, 50);
  });
}
function speak(text, L, id){
  return new Promise(resolve => {
    if (id !== runId) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = BCP[L]; const v = voiceFor(L); if (v) u.voice = v;
    u.rate = parseFloat(els.rate.value);
    let done = false, started = Date.now();
    const fin = () => { if (!done){ done = true; clearInterval(guard); resolve(); } };
    u.onend = fin; u.onerror = fin;
    const guard = setInterval(() => { if (id !== runId || (Date.now() - started > 800 && !synth.speaking && !synth.pending)) fin(); }, 300);
    keep.push(u); if (keep.length > 20) keep.shift();
    synth.speak(u);
  });
}
function partsOf(it){
  const P = [];
  if (S.read !== "trans" || !it.t) P.push({k:"o", text: it.o, lang: it.ol});
  if (S.read !== "orig" && it.t) P.push({k:"t", text: it.t, lang: it.tl});
  return P;
}
function playable(){ return items.map((_,i) => i).filter(i => !S.onlyMarked || marks[items[i].o]); }
async function run(from){
  const order = playable();
  if (!order.length){ els.status.textContent = t(S.onlyMarked ? "noMarkedToPlay" : "ready"); return; }
  const id = ++runId; synth.cancel();
  playing = true; setPlayBtn();
  let pos = order.findIndex(i => i >= from); if (pos < 0) pos = 0;
  while (id === runId){
    if (pos >= order.length){ if (S.loop) pos = 0; else break; }
    const i = order[pos]; current = i;
    const it = items[i], parts = partsOf(it), reps = parseInt(els.repeat.value, 10);
    for (let r = 1; r <= reps && id === runId; r++){
      for (let p = 0; p < parts.length && id === runId; p++){
        mark(i, true, reps > 1 ? r + "/" + reps : "", parts[p].k);
        els.status.textContent = t("now", {i: i+1, n: items.length}) + (reps > 1 ? t("nowRep", {r, t: reps}) : "");
        await speak(parts[p].text, parts[p].lang, id);
        if (p < parts.length - 1) await wait(Math.max(0.4, parseFloat(els.repGap.value)) * 1000, id);
      }
      if (r < reps) await wait(parseFloat(els.repGap.value) * 1000, id);
    }
    if (id !== runId) return;
    if (pos + 1 < order.length || S.loop) await wait(parseFloat(els.gap.value) * 1000, id);
    pos++;
  }
  if (id === runId){ playing = false; setPlayBtn(); mark(-1); current = order[0] || 0; els.status.textContent = t("done"); }
}
function start(i){ if (!synth || !items.length) return; run(Math.max(0, Math.min(i, items.length - 1))); }
function halt(msg){ runId++; if (synth) synth.cancel(); playing = false; setPlayBtn(); if (msg) els.status.textContent = msg; }
function setPlayBtn(){ els.play.textContent = t(playing ? "pause" : "play"); }
function step(d){
  const order = playable(); if (!order.length) return;
  let pos = order.indexOf(current);
  if (pos < 0) pos = d > 0 ? order.findIndex(i => i > current) : [...order].reverse().findIndex(i => i < current) >= 0 ? order.length - 1 - [...order].reverse().findIndex(i => i < current) : 0;
  else pos = Math.max(0, Math.min(order.length - 1, pos + d));
  if (pos < 0) pos = order.length - 1;
  current = order[pos];
  if (playing) start(current); else mark(current, true);
}
els.play.addEventListener("click", () => { if (playing){ halt(t("paused", {n: current+1})); mark(current, true); } else start(current); });
$("stop").addEventListener("click", () => { halt(t("stopped")); current = 0; mark(-1); });
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));

// ---------- settings ----------
function outputs(){
  $("rateOut").textContent = parseFloat(els.rate.value).toFixed(1) + "×";
  $("gapOut").textContent = t("sec", {n: parseFloat(els.gap.value).toFixed(1)});
  $("repeatOut").textContent = t("times", {n: els.repeat.value});
  $("repGapOut").textContent = t("sec", {n: parseFloat(els.repGap.value).toFixed(1)});
}
["rate","gap","repeat","repGap"].forEach(k => els[k].addEventListener("input", () => { outputs(); save(); }));
$("loop").addEventListener("change", e => { S.loop = e.target.checked; save(); });
$("showO").addEventListener("change", e => { S.showO = e.target.checked; render(); save(); });
$("showT").addEventListener("change", e => { S.showT = e.target.checked; render(); save(); });
$("onlyMarked").addEventListener("change", e => { S.onlyMarked = e.target.checked; if (playing) halt(t("stopped")); render(); save(); });
$("uiLang").addEventListener("change", e => { S.ui = e.target.value; applyUI(); save(); });
$("srcLang").addEventListener("change", e => { S.src = e.target.value; render(); save(); });
$("tgtLang").addEventListener("change", e => { S.tgt = e.target.value; render(); save(); });
$("splitSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.split = b.dataset.v; segs(); if (playing) halt(t("stopped")); current = 0; render(); save(); });
$("readSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.read = b.dataset.v; segs(); save(); });
let tmr;
[els.text, els.trans].forEach(ta => ta.addEventListener("input", () => {
  if (playing) halt(t("edited"));
  clearTimeout(tmr); tmr = setTimeout(() => { render(); save(); }, 250);
}));
function loadSample(){
  halt(t("ready"));
  els.text.value = S.ui === "fr" ? SAMPLE_DE : SAMPLE_FR;
  els.trans.value = SAMPLE_T[S.ui];
  current = 0; render(); save();
}
$("sample").addEventListener("click", loadSample);
$("clear").addEventListener("click", () => { halt(t("ready")); els.text.value = ""; els.trans.value = ""; current = 0; render(); save(); els.text.focus(); });

// ---------- init ----------
if (saved){
  ["ui","split","src","tgt","read","showO","showT","onlyMarked","loop"].forEach(k => { if (saved[k] != null) S[k] = saved[k]; });
  if (!I18N[S.ui]) S.ui = "en";
  els.text.value = saved.text || ""; els.trans.value = saved.trans || "";
  ["rate","gap","repeat","repGap"].forEach(k => { if (saved[k] != null) els[k].value = saved[k]; });
}
$("loop").checked = S.loop; $("showO").checked = S.showO; $("showT").checked = S.showT; $("onlyMarked").checked = S.onlyMarked;
if (!saved || (!els.text.value && saved.text == null)){ els.text.value = SAMPLE_FR; els.trans.value = SAMPLE_T[S.ui]; }
applyUI();
if (synth && "onvoiceschanged" in synth) synth.onvoiceschanged = fillVoices;
setTimeout(fillVoices, 600);
})();
</script>
